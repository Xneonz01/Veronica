- version: "0.30.2"
  label: "Only what you said"
  date: 2026-09-26
  channel: dev
  sections:
    fixed:
      - "Learning could file one of the examples from her own instructions as something you had said: a model saved User is building an ESP32 weather station from a chat about something else. The examples are now ordinary ones, and a fact that is one of them over again, when you said at most half of its words, is dropped; the recap she writes at the end of a call is checked the same way. On the learning test (18 conversations, three runs on qwen3.5:9b) no run filed an example or any other false memory, and each found 11 of the 13 facts it should, against 0.77 of them at the last measurement (0.15.1)."
      - "A damaged voices.json stopped her backend from starting. It is now set aside in the voices folder, named voices.json.damaged with the time, she starts without her saved voices, and the app says what happened. The voice clips themselves are untouched. One that can't be set aside is left as it is and never written over: the app says so, and no new voice can be saved until it is put right."
      - "A diagnostics folder she couldn't write to (closed to her account, a file in its place, a full disk) stopped her backend from starting. She now starts without diagnostics for that run, and the console says so."
      - "Learning now keeps why its last try failed, by the kind of failure and never the words, and diagnostics show how many conversations are waiting to be learned from and how many keep failing. A try that failed on the way, such as a timeout, no longer makes the next one read less of the conversation: only an answer she couldn't read does."
      - "Her file tools could read the notes kept only on this computer in her own folder, the ones never published with her: working notes, a plan, instructions for coding agents. They are now out of reach, as her private data is."
      - "A personality that fills her context window, which emoji or a rare script can do within its 4,000 characters, turned every chat message away as having no room. It is now refused when you save it, saying why: 1,200 emoji are, and English at the full length leaves room for a message of over 3,000 tokens."
      - "A long file she read or saved in the middle of an answer could still leave her next step over the window when nothing older in the conversation was left to make way. The earlier steps of that answer are now shortened first (a long text she wrote into a file is kept as its length, and the results before the last step as a note that they were left out), and if even that doesn't fit, she answers from what she has, without her tools."
      - "Her estimate of how much of the window a text takes could come out under her model's own count for text of a kind it had never been measured on, and a message of it could then push her personality out: Amharic came out at a third of the count, and a long run of underscores at one token. Text of a kind never measured is now counted by its size in bytes, which her model's count never exceeds."
      - "A message of over a million characters closed the chat connection, and was lost. The app now keeps it in the box and says it is too long."
      - "A request turned down as invalid could put what was typed into her log: a memory over its length went there whole. The log now keeps only which field it was and what was wrong with it."
