  date: 2026-09-25
  channel: dev
  sections:
    improved:
      - "Chat is learned from once she's free: when no call is on and nothing has used her model for five minutes. If you write to her or start a call while she is learning, she stops and answers you first, and learns from that conversation later: written to in the middle of learning from a long conversation, she began her reply 0.13 to 0.48 seconds after the question (0.07 when idle), where finishing first would have taken almost 9 seconds. Learning took 1.4 and 1.6 seconds for two short conversations."
