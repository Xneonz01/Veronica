      - "A question written in capitals no longer brings in every passage: each of its words counted as a code, and a passage naming a code was given to her however unrelated. A number with a unit or an ordinal ('10kg', '3pm', '2nd') and a plain decimal ('1.5') no longer count as codes either."
      - "A code named in a section's heading now counts for every passage in that section, not only the one holding the heading line."
