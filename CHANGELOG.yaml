      - "A language model that can't use tools can't be used at all: she needs tools for every answer, and doesn't yet fall back to answering without them."
      - "Learning still sometimes finds nothing in a conversation that states a fact plainly: asked 20 times each, three such conversations came back empty once in 60. Anything missed can still be saved by asking her to remember it."
      - "How freely learning lets her model write was set by measuring qwen3.5:9b. Another model may need a different setting, and it can't be changed in the app yet."
      - "On a call, when her memory can't be searched she answers without it, and says nothing of it."
      - "Without a recovery key, her memory and her voices open only in the Windows account she was set up under, on that computer."
      - "A recovery key opens her memory with the memory.key file beside it, not the memory file alone: keep the key file with her memory when you move it."
      - "Anyone with your recovery key and a copy of her data folder can read her memory and voices. Keep it as you would a password."
      - "Another program on this computer can ask her for a new recovery key while she runs, as it can call the rest of her backend: it then holds a key that opens any copy of her data folder, and the one you saved stops working. Every open window says so when it happens."
      - "Copying the key puts it on the clipboard, which Done clears; Windows' clipboard history, if it is on, keeps its own copy."
      - "After a recovery key opens her data for this account, her memory and voices open only once her backend restarts; the notice says so."
      - "A stolen disk can be read by someone who knows your Windows password, or from an account that has none: Windows keeps the keys that protect hers on the same disk, locked with that password. BitLocker protects the disk itself."
      - "The files you attach in chat, her personality and her diagnostics are not encrypted, and on a system other than Windows nothing is."
      - "Software running as your Windows account can open her keys as she does, while she runs or not."
      - "Encrypting doesn't wipe the plain files it replaces: the old blocks of her memory file and her voice clips stay on the disk until something is written over them."
      - "An upload over 1 MB still passes through a temporary file that the web server underneath her makes; Windows deletes it when it is closed, even after a crash."
      - "A version before 0.32.0 can't open her encrypted memory, or the copies kept from before updates, so going back to one isn't possible."
      - "The recap of a call, which the next call's greeting uses, is still written once, as the call ends: with her model away then, the next greeting has none."
      - "The activity log can't be read in the app yet: the entry the notice names can be looked at only at /audit on her backend, or with a tool that opens her memory file."
      - "A review has no key, like the log's own fingerprints: someone who edits her memory file and knows how the log works can mark their own change as reviewed."
      - "While a review runs, anything else she records waits for it: 0.78 seconds on a log of 100,000 entries."
      - "How much of a conversation fits is estimated, not counted. On the 39 texts kept with her tests, from prose, data and code to random letters, emoji and thirteen other languages, the estimate came out at or above her model's own count every time: up to 16% above for data such as logs and JSON, 22% for English prose, 1.6 to 1.7 times for code and up to 2.4 times for other languages, whose conversations she keeps less of than would fit, and up to 12 times for a text of nothing but spaces or blank lines. It describes qwen3.5:9b; another model should be measured with scripts/token_probe.py first."
      - "With llm.num_predict set to 0, no limit on a reply is sent to her model, while the window keeps room for a reply of 2,048 tokens: a longer one can push the start of the conversation, her personality first, out of the window."
      - "A personality saved before this version that fills the window isn't checked until it is saved again: until then chat turns every message away, saying to shorten it."
      - "A copy of one of her examples that the model reworded still gets through, and shows on the Memory page like any other memory."
      - "A memory already filed from the old example stays until you forget it on the Memory page."
      - "A message long enough to leave no room for your documents is answered without them, and nothing on screen says so."
      - "A question saved earlier that no longer fits, because her personality has grown longer since, is turned away when you ask it again but stays in the conversation."
      - "The test of planted instructions judges only her first step. When that step looks something up first, or an action is sent back to fix its details, the case is left unscored rather than guessed; none were in these runs."
      - "That test counts what her permission system would let through, not what the action then does: a correction whose old memory doesn't exist would still fail."
      - "If you moved her data folder with an earlier version, her memory and voices are still in the data folder inside Veronica's folder. Until you move them into yours, she starts without her memory and says what to do, rather than start a new, empty one. That her voices are there is said only in the log."
      - "A place you set for one of her stores on its own, such as memory.db_path, is kept out of her file tools but isn't made private to your account: only her data folder is."
      - "The check compares this computer with what Veronica used on one computer with her default settings. A bigger language model or a longer context needs more than it says, and so do other programs using the graphics card or memory while she runs."
      - "On a computer with more than one graphics card, the check reads the one with the most memory."
      - "The memory check doesn't judge whether what is left for Windows and your other programs is enough: nothing measured says how much they need."
      - "Whether her language model can use tools is checked only where Ollama lists what its models can do, as version 0.33.3 does."
      - "With Ollama stopped, a check takes about 2 seconds before it says so (2,013 ms measured): the time Windows takes to refuse a connection on the same computer."
      - "Her memory model now takes about 1.3 GB of graphics memory as soon as she starts, where it used to wait for the first message. Setting memory.warm_on_start to false brings the old way back."
      - "While her memory can't be used, each page that needs it, and Keep in the companion, only says it is unavailable; the notice at the top of the main window says why."
      - "Asked something your documents don't cover, she can still be given a passage that comes close: 3 of the 10 such questions in the test library were, such as the flight out when asked about the flight home. She can say it doesn't answer."
      - "The second reading is done in English. Passages in another alphabet, such as Arabic or Chinese, are chosen as they were before 0.23.0, and in French, German or Spanish it is less sure."
      - "It needs one more model on disk (91 MB). Without it, search works as it did in 0.22.1, and a notice says the model isn't installed; the models' install script fetches it."
      - "Documents added before 0.22.0 keep working, but don't know their section headings, and can still hold a passage that is only a heading. A document added with 0.22.0 can be missing a heading that sat straight before another, or all but the last of a run of comment lines in a code file. Remove such a document and add it again to fix both."
      - "Headings are read only in Markdown files: a note pasted as text, or a .txt file written with # headings, is searched without them."
      - "Two test questions worded very differently from their passage ('get the limescale out' for 'descale') are no longer among what she reads, where 0.22.1 found them; it finds two others instead, so it is still 57 of 59."
      - "A part of a conversation read after a pause comes with the last two exchanges before it, not the whole conversation: something that only makes sense with what was said earlier than that can still be missed or filed wrongly."
      - "Learning tells what a part after a pause says from what it repeats by the words you used: a fact you gave only by answering yes to her question isn't filed then, and something from before the pause said again together with something new ('watches Formula 1 races' beside 'watches a lot of Formula 1') can be filed a second time."
      - "The secrets check reads words and shapes, not meaning: a secret worded in a way nobody has measured yet can still be remembered, and a passage that lists secret words next to a code-like word ('OTP, 2FA') can still be dropped from a document."
      - "When the data folder can't be made private, or is left as it is (a network drive, a drive without permissions, a setting that names more than her data), only the log and diagnostics say so; nothing on screen does."
      - "A file inside the data folder that has a second name elsewhere (a hard link) is left as it is."
      - "Another program running on this computer can still talk to her directly; a web page can't. Closing that needs the desktop app to start her itself, which is planned."
      - "The activity log's fingerprints have no secret key: someone who rewrites an entry, every fingerprint after it and the record of where the log ends is not caught. It catches an entry changed or removed without doing that."
      - "The check reads first-person words from a set list, so a claim worded another way, or in the passive ('That's saved to my memory'), gets no note. A greeting to you by name ending in a comma ('Hey Rowan,') reads as the start of a letter, so a claim after it isn't read."
      - "She isn't told when a claim of hers went unbacked, so if you then ask her to go ahead, she may answer that it's already done."
      - "A reworded instruction gets past the check on what she read: it looks for words she copied, not for their meaning. In the new test, the one change that went through without asking was a name change read in a file, which she saved in her own words."
      - "What she reads can still colour what she says: after you declined a planted request, she repeated the planted claim as if it were true."
      - "The activity log keeps the words of what she was asked to remember or forget, with anything that looks like a secret blanked out. Forgetting removes a memory from her memory, not from that log."
      - "When the model can't tell you have finished, she waits the full 0.8 seconds before answering, longer than the 0.4 she always used to wait. Two of the probe's eight questions did."
      - "The end-of-turn model was tuned on synthesised speech; it still needs a pass with a real microphone."
      - "The limits on a spoken reply and on the greeting are counted in characters and timed on the default voice, so a cloned voice that speaks more slowly takes a little longer to reach them."
      - "The first word can be missed when you talk over her while she is speaking: recognition starts from the moment she notices."
      - "Right after a call ends, the first reply of a new call or chat can wait a few seconds while the recap of the call finishes on the same model."
      - "Links in answers are shown as text and can't be clicked yet."
      - "A global shortcut changed from its default may not respond when pressed. This still needs checking in the desktop app."
      - "Files can be attached only after the first message of a new chat, because the conversation doesn't exist before it. The composer says so."
      - "The companion window can't be dragged; its permissions don't include window dragging."
      - "The call hotkey and the tray's 'Start a call' open the call screen but don't start the call."
      - "After an update that changes her memory file's layout, an earlier version won't open it. A copy from before such an update is kept for 30 days, and going back to it is done by hand, moving and renaming files as the notice says. The notice names the files but not where they are: by default, the memory folder inside Veronica's data folder."


