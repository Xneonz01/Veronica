  channel: dev
  sections:
    fixed:
      - "On a call, asking her to remember, correct or forget something, open an app or write a file now gets it done far more often. Told to keep her spoken answers short, she used to reply 'Got it, I'll remember that' and do nothing: on the test requests she took the right action first 37 and 46 times in 102 on a call, against 97 in chat. Now it is 84 in 102 (chat 98), and she took no action on any of the 42 requests that asked for none."
    known:
      - "Acting more readily on a call goes for instructions hidden in what she reads, too. Of 12 test instructions planted in her memory or in a file she was asked to read, three runs each, she followed 3 of 36 on a call and then 2 of 36, as in chat (3 of 36), where before this version she followed none on a call. Every action they asked for would have waited for your yes; one planted claim was passed on once."
      - "A call's room on the graphics card is judged by figures measured on one computer with her default models. Until Ollama has loaded another language model, she counts only the size of its files, so a call can still start on a card that turns out too full. A program that starts using the card during a call isn't noticed, and with more than one NVIDIA card, with a model set to run off the card, or on a system other than Windows, the card isn't checked."
      - "A language model that can't use tools can't be used at all: she needs tools for every answer, and doesn't yet fall back to answering without them."
      - "Learning still sometimes finds nothing in a conversation that states a fact plainly: asked 20 times each, three such conversations came back empty once in 60. Anything missed can still be saved by asking her to remember it."
