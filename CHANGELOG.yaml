  date: 2026-09-25
  channel: dev
  sections:
    improved:
      - "The data folder check now looks at everything in the folder, not only its top two levels, and at who owns each file: 7 ms for a folder of 150 entries (median of 20 runs), where the two-level check took 1.2 ms."
    fixed:
      - "Answers about code or documents that mentioned a file ('I've added error handling for when the file doesn't exist', 'the numbers from report.pdf') got 'No file was actually written just now'. A file now counts only when it is what she says she wrote, or where she put something."
      - "When she saved something and said 'I've updated your preferences', the note said her memory hadn't changed, which was false. When another memory action did run, the note now says only what didn't: 'I saved that as a new memory; nothing older was changed.'"
