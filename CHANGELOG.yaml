- version: "0.22.1"
  label: "A closer read"
  date: 2026-09-25
  channel: dev
  sections:
    fixed:
      - "No text is left out of document search any more. 0.22.0 dropped a heading followed straight by another at the same level, such as a list of error codes written as headings, and a heading at the very end of a document. Every heading is now kept, in its passage or in the path above it."
      - "In code, configuration and plain-text files, a line starting with # is text again, not a heading: 0.22.0 read comments as headings and kept only the last of several in a row. Headings are read in Markdown files only, and not inside a block of code."
