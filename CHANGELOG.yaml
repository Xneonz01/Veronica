      - "Veronica now judges from how you speak whether you have finished, instead of always waiting 0.4 seconds of silence. On the call probe, six of eight questions were taken after about 0.23 seconds (the median wait fell from 426 to 236 ms), and a pause in the middle of a sentence now gets up to 0.8 seconds before she takes her turn, where it used to get 0.4."
    improved:
      - "Listening for your voice runs on its own thread, so the call's connection and her audio no longer wait behind it."
