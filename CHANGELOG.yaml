- version: "0.15.1"
  label: "Steadier chat, calls and memory"
  date: 2026-09-24
  channel: dev
  sections:
    improved:
      - "Text chat, and learning from finished conversations, now run on qwen3.5:9b, which takes 5.4 GB of graphics memory where qwen3:14b took about 9.6 GB. On Veronica's own prompts (medians of three runs) it chose the right action for 25 of 26 requests (qwen3:8b, the model calls use: 22), answered 29 of 29 questions right in two runs of three (qwen3:8b: 27), and saved no false memory from 18 test conversations in two runs of three (qwen3:8b: 4 or more in every run), though it kept fewer of the facts worth keeping (10 of 13; qwen3:8b: 11). It is slower to start answering (711 ms against 485 ms), so calls stay on qwen3:8b for now."
      - "Her memory learns only from what was said in a conversation, no longer from the contents of files she read or memories she recalled during it."
      - "Screen readers hear her answer once, whole, when it is finished, instead of word by word as it arrives, and failures are read out the moment they appear."
    fixed:
      - "Her memory could save 'User' or 'Veronica' as your name, or an empty one, after a conversation in which you never gave it, and once saved your sister's name as yours. A name is now learned only when you give it as your own."
      - "A secret could reach her memory reworded: told 'my bank PIN is 4821', the memory extractor can write 'User has a bank PIN of 4821', which the filter that keeps secrets out didn't recognise. It does now."
      - "A detail left blank in what she learned from a conversation threw away everything else learned from it."
      - "A question asked from the command palette was lost: the answer appeared under nothing, and 'Ask again' had nothing to send."
      - "Clicking the conversation that is already open cancelled the answer she was still writing in it."
      - "The card for a file she read showed the instructions meant for her model and the file between markers. It now says what she did, such as 'Read notes.md', and conversations saved before show the file's text."
      - "Words from an answer still on its way could appear in the conversation you had just switched to, or in a new chat."
      - "After opening a conversation that had been deleted in another window, your next message was filed into the conversation you had open before."
      - "Pressing Stop just as an answer finished hid that answer, although it had been saved and came back on the next reload."
      - "Stopping an answer, or losing the connection in the middle of one, also removed the cards for what she had already done, such as writing a file. They stay now, and an answer cut off by a dropped connection says so, with a way to ask again."
      - "'Ask again' after a failed answer showed the question twice, and saved it twice."
      - "Allowing a request that had just run out did nothing and said nothing. It now says your OK didn't reach her."
      - "A double click on Send could stop the answer it had just asked for."
      - "A message made only of unusual blank characters left the composer waiting on 'Thinking' for good."
      - "An error during a call, such as 'I can't think right now', disappeared before it could be read. It stays until you speak again."
      - "Talking over the last words of her sentence didn't stop them: what was already sent kept playing. It stops as soon as she hears you."
      - "Ending a call while it was still connecting could leave the microphone on, or report a connection error for a call you had just ended."
      - "A missing or busy microphone at the start of a call was reported as the voice service being down. It is named as the microphone, with what to do about it."
      - "A call that dropped because the backend stopped ended without a word. It now says the call dropped."
      - "Switching microphones twice in quick succession, or while muted, could leave the wrong one in use, or unmuted."
      - "Unplugging your only microphone said it had switched to another one."
      - "The microphone test in a call's settings kept running after the settings were closed."
      - "Closing 'Add a voice', or switching to uploads, while recording left the microphone recording."
      - "A chosen microphone or speaker that was unplugged and plugged back in is the choice again, as a call already treated it; Windows' duplicate 'Communications' entries are no longer listed."
      - "A memory saved before a call started made her orb ripple as the call began."
      - "A failed change on the Memory page left its message there for good. It can now be dismissed."
      - "A page that failed to draw took the whole window with it, ending a call in progress. Only that page is replaced now; everything else carries on."
      - "Text typed into her personality while it was saving was lost when the save finished."
      - "With unsaved changes to her personality, starting a call or switching conversation from the palette or the sidebar went ahead behind the 'Leave without saving?' question, even when you chose to keep editing. Nothing happens now until you leave."
      - "A new project's name left half-typed created the project and replaced the conversation you clicked with an empty chat. It is still created, but no longer opened over your click."
      - "After a rename, an edit, a new project, a permission request or folding the sidebar, the keyboard went to the top of the page. It goes back to where it was."
      - "Shortcuts with punctuation or numpad keys were saved in a form the desktop app couldn't use. They are recorded by the key's place, and a key that can't be part of a shortcut is refused with the reason."
      - "Two desktop settings changed quickly and both refused could leave a switch showing a value Windows didn't have."
      - "Moving a conversation to a project with a quick double pick could file it in the wrong one."
      - "Loading states and a 'Try again' that failed again weren't read out by screen readers, and the length warning on her personality interrupted every keystroke past the limit."
    known:
      - "Turns from a conversation you switch away from are not learned from, only the conversation open when the session ends."
      - "Links in answers are shown as text and can't be clicked yet."
      - "A global shortcut changed from its default may not respond when pressed. This still needs checking in the desktop app."
      - "Files can be attached only after the first message of a new chat, because the conversation doesn't exist before it. The composer says so."
      - "The companion window can't be dragged; its permissions don't include window dragging."
      - "The call hotkey and the tray's 'Start a call' open the call screen but don't start the call."
      - "Previewing a voice during a live call can switch the call's voice for a sentence or two."
      - "Moving or renaming Veronica's folder breaks every saved voice: each voice's clip is stored by its full path, so a call then fails as it starts."

- version: "0.15.0"
  label: "A new face: every screen redesigned, in light and dark"
  date: 2026-09-24
  channel: dev
  sections:
    new:
      - "Every screen has been rebuilt on one design: calm surfaces, her mark in emerald where she is present, and conversations that read like documents rather than chat bubbles."
      - "Light and dark themes, or follow the system. Choose in Settings, or type 'dark' or 'light' into the command palette. The change applies at once, and the chosen theme is in place before the first paint, so nothing flashes on start-up."
      - "A sidebar with a new chat, search, your projects and your conversations grouped by day. Conversations are renamed in place, moved between projects and deleted after a question. The sidebar folds to a rail of icons and remembers it, and folds by itself when the window is too narrow for it."
      - "A command palette on Ctrl+K: ask her something directly, go to any page or part of Settings, start or end a call, change the theme, or open a project or a conversation. Ctrl+Shift+O starts a new chat from anywhere."
      - "A call carries on while you look at other pages, with a dock in the sidebar to mute or end it."
      - "Answers show the actions she took as cards, numbered citations that open the passage she was shown, and a line saying when an answer came from your files or from what she remembers."
      - "Settings is organised into General, Personality, Calls, Desktop and About, and each part has its own address, so the palette can open it directly."
      - "The personality editor keeps your draft until you save it (Ctrl+S), asks before you leave with unsaved changes, and warns you if the personality was changed somewhere else while you were editing. 'Start from the original' puts her original personality in the editor as a draft rather than saving it straight away."
      - "Shortcuts are set by pressing them. Keys are read by their place on the keyboard, so Shift and AltGr combinations work, and a combination that would take a key from every other app is refused with the reason."
      - "Pages that fail to load say what happened and offer another try: the conversation and project lists, memory, documents, voices, the personality and the About page. The lists reload by themselves when the backend comes back."
      - "An address that leads nowhere shows a page with a way back to chat, and a screen that fails to draw offers a reload instead of an error."
    improved:
      - "Permission requests are a card titled 'Can I go ahead?' with a countdown, and they never take the keyboard while you are typing."
      - "The composer keeps taking your words while the connection is down. Only sending waits, and the line under the composer says so."
      - "Choosing a microphone or speakers on the Voices page or in Settings now moves a call in progress, as the call's own settings already did."
      - "The device list tells a missing microphone apart from one whose name is hidden, and says how to unblock a refused one."
      - "The Voices page says when she is speaking in her built-in voice."
      - "Long names (voices, projects, documents, links in answers) wrap instead of pushing the page sideways."
      - "When she checks her memory, the card in her answer shows what she found, not the instructions her memory gives the model."
      - "The microphone test says when a microphone is busy in another app, rather than calling it refused."
    fixed:
      - "The countdown rings on permission requests and Undo notices now animate."
      - "In the companion window, the shortcut that keeps a note as a memory no longer sends it as a question as well."
      - "Pressing Enter or Space while typing could answer a permission request. The request no longer takes the keyboard from a field you are typing in."
      - "An approval that never reached the backend vanished as if it had worked. It is now reported, and nothing is done."
      - "A conversation deleted in another window, or one with no messages, showed a loading placeholder forever when opened. It now says the conversation is gone, or that it is empty."
      - "A message that failed to send from a new chat gave no sign of it. The problem is now shown above the composer, and the message stays in the box."
      - "When a list failed to load, the sidebar said you had no conversations or projects yet. The Memory page did the same, with counts of 0."
      - "A renamed conversation that didn't save went back to its old name without saying so."
      - "An answer that came back empty showed only her mark, as if she were still working. It now says no answer came back."
      - "The Call page offered to start a call while the backend was down."
      - "A server's stock error text, such as 'Not Found', could appear on screen. It never does now."
      - "A conversation with no title showed as a blank row. It is listed as 'Untitled conversation'."
      - "Pressing Stop could bring part of the stopped answer back: words already on their way were shown as a new answer."
      - "During a call, the screen said she was listening while her last sentence was still playing. It now says she is speaking until you have heard all of it."
      - "The microphone could stay on after recording a voice clip, or testing the microphone, was stopped while the permission prompt was open; a microphone that failed to start left the recorder's audio running."
    known:
      - "Links in answers are shown as text and can't be clicked yet."
      - "A global shortcut changed from its default may not respond when pressed. This still needs checking in the desktop app."
      - "Files can be attached only after the first message of a new chat, because the conversation doesn't exist before it. The composer says so."
      - "The companion window can't be dragged; its permissions don't include window dragging."
      - "The call hotkey and the tray's 'Start a call' open the call screen but don't start the call."
      - "Previewing a voice during a live call can switch the call's voice for a sentence or two."
      - "Moving or renaming Veronica's folder breaks every saved voice: each voice's clip is stored by its full path, so a call then fails as it starts."

- version: "0.14.0"
  label: "Diagnostics, patch notes and a public-release cleanup"
  date: 2026-09-24
  channel: dev
  sections:
    new:
      - "A black box now records each run of the backend in data/telemetry: start and stop, calls, unhandled errors, warnings from the logs, and crashes, including native ones, which are written to a crash log in the run's folder. If the previous run didn't shut down cleanly, the next one records that, and a start-up that fails is recorded with its error rather than passing for a normal exit. Anything that looks like a secret is removed before it is written, and file paths are shortened so they show neither the account name nor where Veronica is installed."
      - "A performance log times the pipeline: start-up, model loads, call warm-up, each stage of a spoken turn, memory lookups, chat turns, actions, document indexing and learning. It rotates at a size cap."
      - "Every spoken turn is now timed stage by stage, from your last word until her first audio is ready: the wait to be sure you've finished, the final transcription, the model's first word, the wait for a whole first phrase, and the first synthesis. The stages add up to that wait, so a slow turn can be pinned on one of them. Turns that ran an action are marked, because their timings aren't comparable with plain replies."
      - "backend/scripts/call_probe.py runs a real call with recorded questions and reports each stage's median, p90 and p95, so two configurations can be compared on equal terms."
      - "Each call's record now says how long the backend's event loop was held up during it, which is what makes a call stutter or react late when you interrupt, along with the memory, threads and open handles in use, so a leak shows as numbers climbing from call to call. GET /diagnostics shows the current lag."
      - "GET /diagnostics and backend/scripts/diagnostics.py summarise recent runs, the last crash and per-stage timings, ready to paste into a bug report. Interrupted turns and turns that ran an action are left out of the timings, since they measure something else."
      - "Patch notes are part of the app: Settings shows the running version and what changed in each release, and /health reports the version."
      - "Telemetry can be switched off entirely with telemetry.enabled."
      - "The memory database now records its schema version. From this release on, a version of Veronica that finds a database written by a newer one refuses to open it, rather than misreading your memories and conversations or writing rows the newer version doesn't expect."
    improved:
      - "Voice latency is measured with the high-resolution clock. The clock used before only advanced in steps of about 15.6 ms on Windows, so every timing was rounded to a step."
      - "The latency log is always written to data/metrics at the top of the project, whichever folder the server was started from."
      - "Documentation rewritten for a public release: a backend architecture guide, a roadmap, a security policy, and plain comments throughout the code."
      - "Text is set in Inter, bundled with the app so no font is fetched from the internet. It is the first step of a redesign: corners and type sizes on the current screens already follow the new design's measurements."
    fixed:
      - "During calls, Veronica's instructions left out the rules about tool results: that anything a tool returns is data, not instructions, and that results should be summarised aloud rather than read out. They are now included whenever tools are offered, as they already were when the call's latency was measured."
      - "Opening an allowed app could launch a program of the same name placed in the folder the backend was started from, because that folder was searched first. It no longer is."
      - "The activity log stored the name of any capability the model made up, and result details such as file names, without checking them for secrets. Made-up names are now logged as 'unknown', and result details are screened the way arguments already were."
      - "With debug logging switched on, the database library copied every stored value, memory contents included, into the console. It now stays quiet at debug level."
      - "An oversized memory id in a web address returned a server error instead of a validation error."
      - "Adding a document by upload stored the path of the temporary file it passed through, which on Windows includes your account name, and the voice list returned the full file path of every voice clip. Neither is stored or returned now."
      - "The backend trusted pages served from any port on this machine, and didn't check which host name a request was addressed to, so a web page that re-pointed its own domain at your machine could read memories, conversations and settings through the read-only routes. Only the app's own origins are accepted now, and requests for any other host name are refused."
      - "With the default settings, Veronica's file tools could read her private data folder and, with your approval, rewrite her own permission file (data/policy.json), her settings or her code. Her data folder, .env and .git are now off-limits to them, and her settings and source are read-only to her."
      - "A profile chosen in .env with VERONICA_PROFILE was reported by /health but its settings were never applied; only the process environment was read at that step. It is applied now."
      - "The console chat script failed at start-up, and 'npm run tauri dev', as documented, failed because the script was missing."
      - "When Veronica asked out loud before acting, that turn's latency figures included however long you took to answer. Her question now counts as the first thing she said."
    known:
      - "The countdown ring on approval prompts and Undo notifications doesn't animate: its keyframes are never emitted into the stylesheet."
      - "The companion window can't be dragged; its permissions don't include window dragging."
      - "In the companion window, Ctrl+Enter both sends the message and saves it as a memory."
      - "The call hotkey and the tray's 'Start a call' open the call screen but don't start the call."
      - "Previewing a voice during a live call can switch the call's voice for a sentence or two."
      - "Moving or renaming Veronica's folder breaks every saved voice: each voice's clip is stored by its full path, so a call then fails as it starts."

- version: "0.13.0"
  label: "Always there: hotkey companion, tray and quick capture"
  date: 2026-07-30
  channel: dev
  sections:
    new:
      - "Press Alt+Space anywhere to bring up a small companion window and ask Veronica something without leaving what you're doing. Press it again, or Esc, to dismiss it. If another app already owns Alt+Space, Ctrl+Alt+Space is used and Settings says so."
      - "Veronica lives in the system tray (Open, Start call, Settings, Quit) and can start with Windows, straight to the tray. Starting at login stays off until you turn it on."
      - "Quick capture: jot a thought into memory from the companion window, with the usual receipt and Undo."
      - "A companion conversation can be opened in the main window and carries on where it was."
      - "Hotkeys, close-to-tray, dismiss-on-blur and start-at-login are set in Settings and apply immediately, without a restart."
    fixed:
      - "The packaged Windows app couldn't save anything: its origin was missing from the allow-list, so every change was refused. Development builds were unaffected, which is why it went unnoticed."
      - "Binding the call hotkey to Ctrl+Alt+Space opened the companion instead of starting a call."
      - "Turning on start-at-login saved the setting even when Windows refused it."
      - "Opening a companion conversation in the main window was lost if the chat screen was already open."
      - "A message that failed to send no longer disappears from the box you typed it in."
      - "Esc closes the companion wherever focus is inside it."
      - "A capture containing only spaces no longer saves an empty memory."
      - "Veronica's own two shortcuts clashing is reported as that, rather than as another app holding the combination."
    known:
      - "Starting the app doesn't start the backend; when the backend isn't running the app says so."
      - "Global shortcuts, the tray and start-at-login are checked by hand. The logic underneath them (hotkey parsing, settings, the summon rule and the conversation handoff) has automated tests."

- version: "0.12.0"
  label: "Acting by voice"
  date: 2026-07-30
  channel: dev
  sections:
    new:
      - "Veronica can use her tools during a call: read, list and search files, write a file, and open an app."
      - "Actions that need permission are asked out loud ('That'll write to notes.md. Want me to?') and she waits for your answer. Answering on screen works too, and answering either way closes both prompts."
      - "When a tool takes more than about 0.7 seconds she says a short 'One moment.' instead of going silent."
    improved:
      - "Tools are always available in calls because they cost nothing measurable: with the tool list attached, time to first token was 391 ms against 406 ms without it, and the right tool was chosen in 3 of 3 test prompts."
      - "Every backend source file is now under 300 lines."
    fixed:
      - "'Okay, don't' was taken as consent. A refusal now counts anywhere in the reply while agreement has to open it, and a reply containing both is asked again."
      - "Interrupting Veronica while an action was running didn't cancel the action. It now stops with the turn."
      - "Answering a repeated confirmation question could cancel the confirmation it was answering."
    known:
      - "Running code is not available. Windows has no quick, complete sandbox, and a subprocess with a timeout isn't one."

- version: "0.11.1"
  label: "Chat fixes"
  date: 2026-07-30
  channel: dev
  sections:
    fixed:
      - "A conversation with more than 500 messages reopened at its beginning instead of at its latest messages."
      - "A new conversation started after viewing an old one was never learned from."
      - "Clicking a conversation or switching project while the connection was being re-established could raise an error."
      - "An upload that finished after switching conversations could appear under the wrong one."
      - "An oversized number in a URL returned a server error instead of a validation error."

- version: "0.11.0"
  label: "Chat"
  date: 2026-07-28
  channel: dev
  sections:
    new:
      - "A chat window that shares one brain with the voice call: streaming replies, conversations that survive restarts, and tool calls shown inline."
      - "Attach documents to a conversation and ask about them. Answers cite the passage they came from, and the quoted text is kept with the answer. Images are stored and listed as 'Stored, not read', because there is no vision model yet."
      - "Projects: file conversations into named projects. Inside a project Veronica only cites documents attached to that project."
      - "Edit Veronica's personality in Settings. Changes apply from her next reply."
      - "Stop cancels a reply that is still being generated."
      - "The app now opens on Chat rather than the call screen."
    improved:
      - "The first message after the language model has been unloaded no longer times out: connecting is allowed 5 seconds and loading the model 120."
    fixed:
      - "Deleting a conversation left its attachments, their files and their indexed documents behind, and Veronica could keep quoting a document from a deleted chat. Deleting now removes all of it."
      - "The 25 MB upload limit is enforced while reading, so a 30 MB file is refused in about 0.3 seconds instead of after being buffered."
      - "Answers that quoted a document were being learned as facts about you. They are no longer learned from."
      - "Opening an old conversation re-learned everything in it when the window closed."
      - "A reply that failed early could leave the chat stuck on 'Thinking'."
    known:
      - "Projects narrow which documents are cited, not memory: a fact learned inside one project can come up in another."
      - "There is no conversation search or attachment preview yet."

- version: "0.10.0"
  label: "Actions with permission"
  date: 2026-07-28
  channel: dev
  sections:
    new:
      - "Veronica can read, list, search and write files in allowed folders and open allowed applications. Every action goes through a permission check, asks first when it changes something, and is written to an append-only activity log."
      - "Approval requests appear on whichever screen you're on and are refused automatically after 45 seconds. Silence never counts as yes."
      - "Each action can be set to run automatically, ask first, or be switched off, and the choice survives a restart. Destructive actions can never be set to run automatically."
      - "One editable personality now drives both voice and chat."
    fixed:
      - "File access was limited to whichever folder the server was started from; it is now tied to the project folder."
      - "A file's contents could fake the end of the quoted block and have the rest read as instructions. Quoted blocks now carry a random marker."
      - "Files containing Arabic text were refused as binary about half the time, when the check cut a character in half."
      - "Allowed apps are resolved to a full path at start-up, so a program with the same name in the working folder can't be launched instead."
      - "The list of pending approvals failed whenever something was actually pending."
      - "Searching a very large folder could keep running after it had timed out."
      - "A cut-off folder listing is now labelled as partial."
      - "A personality that failed to save no longer takes effect anyway."
    known:
      - "Paths are checked before a file is opened, so a link swapped in between the two isn't caught."
      - "The activity log can't be changed through the app, but it isn't encrypted or hash-chained."

- version: "0.9.0"
  label: "Security and reliability hardening"
  date: 2026-07-28
  channel: dev
  sections:
    fixed:
      - "Any website you visited could read or change your memories through the app's WebSocket connections and simple form posts. WebSocket connections and all changes now have to come from the app itself."
      - "The filter that keeps secrets out of memory now catches access codes (gate, door, alarm, safe), passphrases, one-time codes, PINs, API-key and token shapes, card numbers (checked with the Luhn algorithm) and Arabic phrasings."
      - "Editing a deleted memory could bring it back into Veronica's context while it stayed hidden on the Memory page."
      - "Two memory changes happening at once could save each other's half-finished writes. Every multi-step write is now atomic and serialised."
      - "A GPU error while saving a memory could leave it saved but impossible to find. The slow, fallible step now happens before anything is written."
      - "Pausing mid-sentence could start two replies at once."
      - "A transcription still running when a call ended could complete a whole turn after hanging up."
      - "One malformed audio frame could leave a call silently deaf."
      - "Two sequences of clicks could leave the microphone on after ending a call."
      - "Indexing a large PDF froze everything, audio and interruptions included, for up to 9.6 seconds. Indexing now runs in the background."
      - "A browser tab that stopped reading live updates could stall the call."
      - "A language-model error in the middle of a reply was recorded as a successful, empty turn."
      - "Closing the app right after a call lost that call's summary and anything it learned."
      - "Server errors now always come back with a code the app turns into plain language, and an unexpected error shows a recovery screen instead of a blank window."
      - "Answers about code lost bracketed text: items[0] came back as items."
      - "Chinese, Japanese and Arabic documents were split mid-word, and parts of them could never be found."
      - "Quoted documents had no size limit in the prompt. They now share a token budget, and are fenced and labelled so their contents can't pose as instructions."
      - "With reduced motion switched on, the call's orb stayed on its idle frame for the whole call."

- version: "0.8.1"
  label: "Memory and voice-clone fixes"
  date: 2026-06-26
  channel: dev
  sections:
    improved:
      - "Speech generation settings are the voice model's documented defaults, now passed explicitly so an upstream change can't alter the voice."
    fixed:
      - "'Stop using my name' now takes effect during the call, on that very reply, and stays."
      - "Veronica was saving passing remarks as memories. Only lasting facts and preferences are learned now, repeats are merged, and at most 200 active memories are kept; profile details and pinned memories are never removed."
      - "A voice reference shorter than 5 seconds crashed previews and calls. New voices need at least 6 seconds (10–15 is recommended), and older short voices get a clear message."

- version: "0.8.0"
  label: "She tells you what she remembers"
  date: 2026-06-26
  channel: dev
  sections:
    new:
      - "When Veronica learns or saves something, a notification says what, with an Undo; a short sound plays, and during a call the orb pulses. A bell in the sidebar keeps a log of recent memory changes."
      - "Several things learned in one conversation are grouped ('learned 3 things'). Notifications can be loud, subtle or silent, and sounds can be switched off separately."
      - "Veronica speaks first when a call starts, with a greeting that changes with the time of day and sometimes picks up where you left off. You can talk over it."
      - "How often she uses your name (never, sparingly or often) is a setting she follows on every reply, and saying 'stop using my name' changes it."
      - "The Memory page shows how confident Veronica is about each learned fact and where it came from."
    fixed:
      - "The background memory extraction kept the large language model loaded for 30 minutes and filled the GPU. It now releases the model straight away."

- version: "0.7.0"
  label: "She remembers"
  date: 2026-06-26
  channel: dev
  sections:
    new:
      - "Memory in calls: facts relevant to what you say are brought into each reply, a returning user is welcomed back, and each call ends with a one-sentence summary for next time."
      - "Veronica learns lasting facts from conversations. By default she keeps the ones she's confident about and queues the rest for your review; in review-only mode nothing is kept without your approval."
      - "Text chat on the same memory, with remembering and recalling as tools, and answers grounded in your documents with citations."
      - "A Memory page to browse, search, edit, pin, delete and review everything Veronica knows, and to add or remove documents. Changes show up everywhere immediately."
    improved:
      - "Text chat uses the 14B model, which chose the right memory tool 7 of 7 times in testing against 6 of 7 for the 8B model."
    fixed:
      - "Citation numbers the model invented on answers that cite nothing are removed."
      - "A memory lookup failure no longer aborts a spoken reply; she answers without it."

- version: "0.6.0"
  label: "Memory and documents underneath"
  date: 2026-06-26
  channel: dev
  sections:
    new:
      - "A local memory store (SQLite with vector search) and multilingual embeddings with good Arabic support."
      - "A memory is brought into a reply only when it is related to what was said; recency or importance alone can't pull in something off-topic."
      - "Documents (.txt, .md, .pdf) are split into passages, indexed separately from memory, and retrieved with their source for citation."
      - "Content that looks like a password or other secret is refused, never stored."

- version: "0.5.0"
  label: "Voice Studio"
  date: 2026-06-26
  channel: dev
  sections:
    new:
      - "Add a voice by uploading clips or recording in the app; the clips are combined, trimmed and normalised into one reference. Preview, switch and delete voices; a switch applies immediately, even mid-call."
      - "Choose the microphone and speakers, and switch either during a call without dropping it. An unplugged microphone falls back to the default."
      - "A sidebar to move between screens."
    fixed:
      - "A failure while generating speech could leave a call stuck. It now reports the error and keeps listening."
      - "Creating a voice no longer stalls a call in progress."
      - "A saved microphone that is no longer connected no longer fails the call."
      - "Live updates reconnect after the backend restarts."

- version: "0.4.0"
  label: "The call screen"
  date: 2026-06-26
  channel: dev
  sections:
    new:
      - "A call screen with an animated orb that follows your voice and hers, the live transcript, mute, end call and a latency readout."
      - "The first call after start-up shows 'warming up' while the models load instead of freezing."
      - "Errors are told apart: a brief problem, such as the language model being unreachable, keeps the call going; a call that fails to start offers Retry."
    fixed:
      - "A speech-recognition failure could disappear silently. It now shows, and the call carries on."
      - "Interrupted replies are now included in the latency measurements."

- version: "0.3.0"
  label: "The live call"
  date: 2026-06-25
  channel: dev
  sections:
    new:
      - "Hands-free calls: talk naturally, Veronica listens continuously, answers in her cloned voice, and stops the moment you talk over her."
      - "Replies start playing at the first short clause instead of after the whole sentence."
      - "The latency of every turn is recorded."
    improved:
      - "Calls use the 8B model for speed, keeping 14B for deeper work. Time to first audio fell from 5.8–7.3 seconds to about 1.2–2.4 seconds."
    fixed:
      - "Starting a call no longer blocks while the models load."

- version: "0.2.0"
  label: "Voice building blocks"
  date: 2026-06-25
  channel: dev
  sections:
    new:
      - "Streaming speech recognition (faster-whisper large-v3-turbo) with partial transcripts that only grow, never rewrite themselves."
      - "Streaming replies from a local language model through Ollama, with native tool calling."
      - "Speech in any voice from a short clip (Chatterbox Turbo), streamed sentence by sentence."
      - "Voice activity detection, a GPU model manager that keeps the speech models within the VRAM budget (about 6.8 GB together), and a registry of voices to switch between."

- version: "0.1.0"
  label: "Foundations"
  date: 2026-06-25
  channel: dev
  sections:
    new:
      - "Project skeleton: a FastAPI backend, a React and Tauri desktop app, layered configuration, an in-process event bus, and the design tokens the interface is built on."
