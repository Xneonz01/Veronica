  label: "Fixes from a review of the new call code"
  date: 2026-09-24
  channel: dev
  sections:
    fixed:
      - "Quitting Veronica unloaded her language model from Ollama even when she had never used it, which could take it from another program using the same model. She now releases only a model she has used. Checked against a running Ollama: the tests that start and stop her backend now send it no unload at all."
