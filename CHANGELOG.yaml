      - "A file inside her folders can be named without its full path, such as notes/shopping.md: she reads it in the folder that holds it, and writes a new one where its folder is, or else in the first of her folders. If two of her folders could hold it, she asks which one you mean."
      - "A write you approve goes exactly where the question said, even if another of her folders gains a file of that name while you answer, and her activity log records every file she reads or writes by its full path."
      - "A file name ending in a dot or a space, which Windows drops when it saves the file, can no longer carry a write past the files she keeps to herself."
      - "She knows which folders her file tools may use and which apps she may open, by name. Asked to open the file manager, she used to ask for 'File Explorer', which her list calls explorer, and was refused."
      - "When an answer took her three rounds of tools, what the last round found is put into words. She used to end on the sentence she wrote before it, and leave it unsaid."
      - "A folder listing or a search that stops early tells her so: she no longer presents part of a folder as all of it, or a search she didn't finish as finding nothing."
      - "When her memory or your documents can't be searched for a message, she still answers, and a note under the answer says what it went without. The whole answer used to fail, as it did whenever her memory model wasn't installed; the notice for that now says chat answers without them."
      - "A citation she invents straight after a real one, such as the 7 in [1][7], is removed like any other."
      - "Learning asks her model to write what it learned less freely than a reply. Three conversations that each state a fact plainly, asked 20 times each, came back empty once in 60 instead of 8 times, and the learning test filed 13, 13 and 12 of its 13 facts in three runs, with nothing false, where the last three runs before filed 11 each."
      - "A reply with a long run of blank space in it no longer holds her up while its citations are checked: 20,000 spaces took 3.7 seconds, and now take under a millisecond."
