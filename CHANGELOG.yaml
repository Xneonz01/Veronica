- version: "0.21.1"
  label: "Checks that hold up"
  date: 2026-09-25
  channel: dev
  sections:
    improved:
      - "The data folder check at every start now reads and sets the permissions directly instead of running a command up to seven times: 1.2 ms at a normal start (median of 20 runs on a folder with 7 sub-folders and 140 files), where it was measured at 112 to 118 ms; 12 ms to put back permissions that had changed."
      - "A data folder on a network drive, or on a drive that keeps no permissions (a FAT-formatted USB stick), is now left as it is and noted, instead of risking your own access to it. A data folder setting that is empty, or that names the whole installation, a drive or your home folder, is refused."
      - "Checking the activity log on request reuses the last result until the log changes, and requests made at the same moment share one check."
    fixed:
      - "On a copy of Windows in another language, or when her data folder was open to a group other than the three it looked for, it could be reported as private while other accounts could still read it. Permissions are now read by account ID, whatever the language, and every other account or group is removed."
      - "A data folder or account name with an accented letter could stop her from starting."
      - "Making the data folder private failed whenever its permissions named an account that no longer exists (one deleted, or from another computer), which folders under a Windows user profile often do. The folder stayed open to other accounts."
      - "Putting the data folder right could lock you out of a folder inside it, and could follow a link inside it and change the permissions of files somewhere else. What is inside now takes the folder's own permissions again, and links are never followed."
      - "A fresh install recorded its first start as a repair. The folder is now made private before anything is written into it, her diagnostics included."
      - "Removing the newest entries from the activity log, or all of them, went unnoticed. The log now also keeps where it ends, and a removal stays visible after later entries are added."
      - "When a second program wrote to the activity log at the same moment as she did (the developer chat console can), two entries could follow the same one, and every start after that reported the log as changed. Writes now wait their turn."
      - "An activity log entry changed to hold an unusual value stopped the check instead of being reported as changed."
      - "An action whose result named a file with a character Windows allows but the log can't store left no entry in the activity log. The entry is now kept, with that character spelled out."
      - "After the data folder was moved, deleting a conversation could leave its attached files behind."
      - "The note about a claim nothing backed appeared on ordinary answers: a draft or message she wrote for you, quoted text, code, a CV line ('I launched a mobile app'), 'memory usage', a measurement like 1/2 cup, or a mention of something saved in an earlier conversation. None of the 369 stored evaluation replies gets a note now."
      - "Some real claims got no note: 'I've added that to my memory', 'I've noted that you prefer tea', 'I won't forget that', 'I've updated your preferences', a claim followed by a question in the same sentence, and a claim on a line of its own with no full stop."
      - "Saving a new fact beside a wrong one counted as correcting it. 'I've updated my memory' and 'I've forgotten that' now need a correction or a forget to have run."
      - "In a call, asking her to stop using your name brought a note saying her memory hadn't changed. It had."
      - "In a call, the note was spoken as part of her reply. It now comes after the reply is kept, is shown apart from her words on the call screen, and talking over it or hanging up during it no longer cuts her reply short in the call's history."
      - "In a call, an action you had declined still got a note when she said she wouldn't do it."
      - "'I've saved it' with nothing saved got a note about her memory even when you meant a file. It now says only that nothing was saved."
